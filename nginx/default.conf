# Deployed to /home/container/nginx/default.conf on the frontend server
# (ArtiomsHosting "Nginx static" egg). The site itself goes to www/.

upstream backend {
    server jet1.artiom.me:3006;
}

server {
    include server-port.conf;

    root /home/container/www;
    index index.html;

    # Prerendered pages are served as /path/index.html. Any other path gets
    # the SPA fallback, and React Router renders it in the browser.
    location / {
        try_files $uri $uri/index.html /__spa-fallback.html;
    }

    # The frontend calls the API on the same origin.
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ /\.(?!well-known/) {
        return 404;
    }

    # A missing file (image, stale JS chunk after a deploy) must 404, not get
    # the HTML fallback.
    location ~ \.\w+$ {
        try_files $uri =404;
    }
}
